# Example Apache vhost — TLS is handled by your existing Apache setup.
# Replace finance.example.com and 192.168.1.100:8080 with your values.

<VirtualHost *:443>
    ServerName finance.example.com

    SSLEngine on
    # SSLCertificateFile /path/to/cert.pem
    # SSLCertificateKeyFile /path/to/key.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}

    ProxyPass        /api/ http://192.168.1.100:8080/api/
    ProxyPassReverse /api/ http://192.168.1.100:8080/api/

    ProxyPass        / http://192.168.1.100:8080/
    ProxyPassReverse / http://192.168.1.100:8080/
</VirtualHost>
