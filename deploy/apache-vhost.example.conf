# Example Apache vhost — TLS is handled by your existing Apache setup.
# Requires `headers` (`a2enmod headers`) and `proxy` / `ssl`.
# Replace finance.example.com and 192.168.1.100:8080 with your values.
# The Docker host should stay on the LAN; do not publish 8080 to the WAN.

<VirtualHost *:443>
    ServerName finance.example.com

    SSLEngine on
    # SSLCertificateFile /path/to/cert.pem
    # SSLCertificateKeyFile /path/to/key.pem

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set X-Frame-Options "DENY"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}

    ProxyPass        /api/ http://192.168.1.100:8080/api/
    ProxyPassReverse /api/ http://192.168.1.100:8080/api/

    ProxyPass        / http://192.168.1.100:8080/
    ProxyPassReverse / http://192.168.1.100:8080/
</VirtualHost>
