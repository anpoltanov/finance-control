# Portainer stack — self-contained finance-control app
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance_control}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DEBUG: ${DEBUG:-false}
  BEHIND_PROXY: ${BEHIND_PROXY:-true}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
  JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
  JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
  TIME_ZONE: ${TIME_ZONE:-Europe/Moscow}
  MCP_API_TOKEN: ${MCP_API_TOKEN:-}
  MCP_USERNAME: ${MCP_USERNAME:-}
  USE_HSTS: ${USE_HSTS:-false}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_control}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8000"

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    entrypoint: ["sh", "-c"]
    command:
      - python manage.py migrate --noinput && while true; do python manage.py commit_planned; sleep 60; done

volumes:
  postgres_data:
