# Portainer stack — self-contained finance-control app
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance_control}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DEBUG: ${DEBUG:-false}
  BEHIND_PROXY: ${BEHIND_PROXY:-true}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
  JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
  JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
  TIME_ZONE: ${TIME_ZONE:-Europe/Moscow}
  MCP_API_TOKEN: ${MCP_API_TOKEN:-}
  MCP_USERNAME: ${MCP_USERNAME:-}
  USE_HSTS: ${USE_HSTS:-false}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_control}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d required: without it pg_isready uses a DB named like the user ("finance").
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance_control}"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 1m
      start_interval: 10s

  web:
    image: ${APP_IMAGE:-ghcr.io/anpoltanov/finance-control}:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8000"
    healthcheck:
      # TCP only: an HTTP GET to 127.0.0.1 gets DisallowedHost (400) when
      # ALLOWED_HOSTS is the public hostname.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 10s

  scheduler:
    image: ${APP_IMAGE:-ghcr.io/anpoltanov/finance-control}:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *app-environment
    entrypoint: ["sh", "-c"]
    # Migrate only in web entrypoint — concurrent migrate races on fresh Postgres.
    command:
      - while true; do python manage.py commit_planned; sleep 60; done

volumes:
  postgres_data:
